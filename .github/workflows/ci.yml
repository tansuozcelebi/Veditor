name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # a running deploy must never be cancelled half-way; PR/branch runs can be
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Lint & end-to-end test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: .pw-browsers
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium (+ bundled ffmpeg)
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck & build
        run: npm run build

      - name: End-to-end smoke test (headless Chromium, against the production build)
        run: npm test

      - name: Upload test output (screenshot, exported video)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test/output/
          if-no-files-found: ignore

  # CI-gated auto-merge for private repositories on plans without branch protection:
  # a PR that carries the "automerge" label and is not a draft is merged as soon as the test job is green.
  automerge:
    name: Auto-merge (label "automerge")
    needs: test
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'automerge')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Merge the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --merge --delete-branch=false

      # A merge made with GITHUB_TOKEN does not fire the `push` event (GitHub never lets one
      # workflow run trigger another that way), so the main-branch run – tests + deploy – is
      # started explicitly; workflow_dispatch is exempt from that rule.
      - name: Start the main-branch run (test + deploy)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sleep 10   # let the merge commit land on main before dispatching
          gh workflow run ci.yml --ref main

  # Continuous deployment: every commit that lands on main is built and uploaded to SiteGround
  # over FTPS once the test job is green – on a direct push, on the run the automerge job
  # dispatches after merging a PR, or when started by hand (Actions → CI → Run workflow).
  # Secrets:   SITEGROUND_FTP_HOST, SITEGROUND_FTP_USER, SITEGROUND_FTP_PASSWORD,
  #            SITEGROUND_REMOTE_DIR, SITEGROUND_FTP_PORT
  # Variables: SITEGROUND_SITE_URL (optional, enables the post-deploy HTTP check),
  #            SITEGROUND_BASE_PATH (optional, e.g. /veditor/ when deploying to a sub-folder),
  #            SITEGROUND_FTP_SECURE (optional: true | false | implicit, default true)
  deploy:
    name: Deploy to SiteGround
    needs: test
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-siteground
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for the site
        env:
          VITE_BASE_PATH: ${{ vars.SITEGROUND_BASE_PATH || '/' }}
        run: npm run build

      - name: Upload dist/ over FTPS
        env:
          SITEGROUND_FTP_HOST: ${{ secrets.SITEGROUND_FTP_HOST }}
          SITEGROUND_FTP_USER: ${{ secrets.SITEGROUND_FTP_USER }}
          SITEGROUND_FTP_PASSWORD: ${{ secrets.SITEGROUND_FTP_PASSWORD }}
          SITEGROUND_REMOTE_DIR: ${{ secrets.SITEGROUND_REMOTE_DIR }}
          SITEGROUND_FTP_PORT: ${{ secrets.SITEGROUND_FTP_PORT }}
          SITEGROUND_FTP_SECURE: ${{ vars.SITEGROUND_FTP_SECURE }}
          SITEGROUND_SITE_URL: ${{ vars.SITEGROUND_SITE_URL }}
        run: node scripts/deploy-siteground.mjs --no-build

      - name: Summary
        run: |
          {
            echo "### Deployed to SiteGround ✅"
            echo ""
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Site: ${SITE_URL:-(SITEGROUND_SITE_URL variable not set)}"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          SITE_URL: ${{ vars.SITEGROUND_SITE_URL }}
