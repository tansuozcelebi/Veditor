name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & end-to-end test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: .pw-browsers
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium (+ bundled ffmpeg)
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npx eslint .

      - name: End-to-end smoke test (headless Chromium)
        run: npm test

      - name: Upload test output (screenshot, exported video)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test/output/
          if-no-files-found: ignore
