name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & end-to-end test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: .pw-browsers
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium (+ bundled ffmpeg)
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npx eslint .

      - name: End-to-end smoke test (headless Chromium)
        run: npm test

      - name: Upload test output (screenshot, exported video)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test/output/
          if-no-files-found: ignore

  # CI-gated auto-merge for private repositories on plans without branch protection:
  # a PR that carries the "automerge" label and is not a draft is merged as soon as the test job is green.
  automerge:
    name: Auto-merge (label "automerge")
    needs: test
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'automerge')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --merge --delete-branch=false
